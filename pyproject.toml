[project]
name = "kernel_econ_alignment"
version = "0.1.0"
description = "Replication Code for Solving Models of Economic Dynamics with Ridgeless Kernel Regressions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.9.1",
    "jax>=0.7.2",
    "jinja2>=3.1.6",
    "jsonargparse>=4.41.0",
    "matplotlib>=3.10.6",
    "nlls-gram>=0.5.1",
    "pandas>=2.3.2",
    "quadax>=0.2.9",
    "unopy>=0.4.10",
]

[project.optional-dependencies]
gurobi = [
    "gurobipy>=13.0.2",
]
